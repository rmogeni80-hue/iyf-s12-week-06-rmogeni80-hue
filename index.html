<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h1>Weather Dashboard</h1>
        
        <div class="search-box">
            <input type="text" id="city-input" placeholder="Enter city name...">
            <button id="search-btn">Search</button>
        </div>

        <div id="history-container" class="history-box"></div>
        <p id="message-container"></p>

        <div id="weather-card" class="weather-card hidden">
            <h2 id="city-name"></h2>
            <img id="weather-icon" src="" alt="Weather Icon">
            <p id="temperature" class="temp"></p>
            <p id="description" class="desc"></p>
            
            <div class="details">
                <p>Feels like: <span id="feels-like"></span></p>
                <p>Humidity: <span id="humidity"></span></p>
                <p>Wind: <span id="wind"></span></p>
                <p>Pressure: <span id="pressure"></span></p>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
